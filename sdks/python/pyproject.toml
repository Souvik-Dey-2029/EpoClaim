[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epoclaim"
version = "0.1.0"
description = "Official Python SDK for the EpoClaim Temporal Verification & Grounded Fact-Checking Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "EpoClaim Team" }]
keywords = ["epoclaim", "verification", "fact-checking", "hallucination-detection", "temporal-freshness"]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

