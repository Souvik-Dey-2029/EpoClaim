# ==============================================================================
# EpoClaim — Render Blueprint Specification (render.yaml)
# Single Unified Web Service (FastAPI serves both API and React Frontend)
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

version: "1"

services:
  # ============================================================================
  # EpoClaim Integrated Web Service (FastAPI + React SPA)
  # ============================================================================
  - type: web
    name: epoclaim
    runtime: python
    plan: free
    region: oregon
    # Root directory is the repository root
    buildCommand: ./build.sh
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: backend
      # Runtime host & environment
      - key: ENVIRONMENT
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9

      # CORS Origin Configuration:
      # In unified single-service mode, the frontend is same-origin (relative path).
      # Localhost origins are preserved for standalone frontend development.
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.onrender\\.com$"

      # Security & Limits
      - key: MAX_BODY_BYTES
        value: "2097152"
      - key: MAX_TEXT_CHARS
        value: "100000"

      # Storage & Persistence
      # SQLite ephemeral path; state-independent fact verification requires no disk persistence.
      - key: DATABASE_URL
        value: sqlite:///./epoclaim.db

      # Temporal Reasoning & Verification Defaults
      - key: DEFAULT_HALF_LIFE_HOURS
        value: "168.0"
      - key: RRF_K
        value: "60"
      - key: ENTAILMENT_THRESHOLD
        value: "0.65"
      - key: CONTRADICTION_THRESHOLD
        value: "0.60"
      - key: ENABLE_CORRELATION_DISCOUNTED_SCORING
        value: "false"

      # Optional LLM Feature Flags (Disabled by default for fast, deterministic startup)
      - key: ENABLE_LLM_SEMANTIC_ASSESSMENT
        value: "false"
      - key: ENABLE_LLM_CLAIM_DECOMPOSITION
        value: "false"
      - key: ENABLE_LLM_ANSWER_CORRECTION
        value: "false"

      # ------------------------------------------------------------------------
      # Secure Credentials (Render prompts for these on initial Blueprint creation)
      # ------------------------------------------------------------------------
      - key: TAVILY_API_KEY
        sync: false

      - key: BIFROST_BASE_URL
        sync: false

      - key: BIFROST_API_KEY
        sync: false

      - key: BIFROST_MODEL
        value: gpt-4o-mini

      - key: EPOCLAIM_API_KEY
        sync: false

      - key: EPOCLAIM_ADMIN_API_KEY
        sync: false
